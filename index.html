<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto Fare Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🛺 Auto Fare</h1>
        <p>GPS Fare Calculator</p>

        <div class="settings">
            <h3>Fare Settings</h3>

            <label for="pricePerKm">Price per km (₹)</label>
            <input
                type="number"
                id="pricePerKm"
                value="22.50"
                step="0.01"
            >

            <label for="minimumFare">Minimum charge (₹)</label>
            <input
                type="number"
                id="minimumFare"
                value="30"
                step="0.01"
            >
        </div>

        <button id="startBtn">Start Ride</button>

        <div id="status">
            Ready to start
        </div>

        <div class="info">
            <h2 id="distance">0.00 km</h2>
            <p>Distance</p>
        </div>

        <div class="info">
            <h2 id="fare">₹30.00</h2>
            <p>Estimated Fare</p>
        </div>

        <button id="stopBtn">End Ride</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
